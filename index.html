<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConvBI · Tableau de Bord Conversationnel</title>
  <meta name="description" content="Tableau de bord BI conversationnel — analysez 100 transactions e-commerce marocaines en langage naturel." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- App stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Badge utility classes (inline so they're always available) -->
  <style>
    .badge          { display:inline-block; padding:2px 9px; border-radius:99px; font-size:10px; font-weight:700; letter-spacing:.5px; }
    .badge-blue     { background:#dbeafe; color:#2563eb; }
    .badge-indigo   { background:#e0e7ff; color:#4338ca; }
    .badge-violet   { background:#ede9fe; color:#7c3aed; }
    .badge-default  { background:#f1f5f9; color:#64748b; }

    /* KPI colour helpers */
    .text-blue   { color:#2563eb; }
    .text-indigo { color:#4338ca; }
    .text-amber  { color:#d97706; }
    .bg-blue-soft   { background:#eff6ff; }
    .bg-indigo-soft { background:#eef2ff; }
    .bg-amber-soft  { background:#fffbeb; }
  </style>
</head>

<body>
<div id="app">

  <!-- ══════════ TOP BAR ══════════ -->
  <header id="topbar">
    <div class="logo-icon">
      <!-- chart icon -->
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
    </div>
    <span class="brand">ConvBI</span>
    <span class="badge badge-blue">BETA</span>

  </header>

  <!-- ══════════ MAIN CONTENT ══════════ -->
  <div id="content">

    <!-- ── LEFT: Chat ── -->
    <section id="chatPane">

      <!-- Chat header -->
      <div id="chatHeader">
        <div class="avatar">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
          </svg>
        </div>
        <div>
          <div class="name">BI Assistant</div>
          <div class="avail">● Disponible</div>
        </div>
      </div>

      <!-- Messages -->
      <div id="chatMessages"></div>

      <!-- Quick chips -->
      <div id="chips">
        <button class="chip" onclick="convbiSend('Montre-moi la tendance des ventes')">📈 Tendance</button>
        <button class="chip" onclick="convbiSend('Ventes par région')">🗺️ Régions</button>
        <button class="chip" onclick="convbiSend('Répartition par catégorie')">🥧 Catégories</button>
        <button class="chip" onclick="convbiSend('Quel est le total des ventes ?')">💰 Total</button>
        <button class="chip" onclick="convbiSend('Quelle est la ville la plus active ?')">🏙️ Top ville</button>
        <button class="chip" onclick="convbiSend('aide')">❓ Aide</button>
      </div>

      <!-- Input -->
      <div id="inputArea">
        <textarea id="userInput" rows="1"
          placeholder="Posez une question sur vos données…"></textarea>
        <button id="sendBtn" title="Envoyer">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>

    </section><!-- /chatPane -->

    <!-- ── RIGHT: Dashboard ── -->
    <section id="dashPane">



      <!-- Chart Card -->
      <div id="chartCard">
        <div id="chartHead">
          <div>
            <div id="chartTitle" style="font-size:14px;font-weight:600;color:#1e293b">Aperçu Général</div>
            <div id="chartSubtitle" style="font-size:12px;color:#94a3b8;margin-top:2px">
              Posez une question pour générer un graphique
            </div>
          </div>
          <span id="chartBadge" class="badge badge-default">—</span>
        </div>

        <div id="chartWrap">
          <canvas id="mainChart"></canvas>
          <div id="chartPlaceholder">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <p>Aucun graphique sélectionné</p>
            <span>Utilisez le chat pour analyser vos données</span>
          </div>
        </div>
      </div><!-- /chartCard -->

    </section><!-- /dashPane -->

  </div><!-- /content -->
</div><!-- /app -->

<!-- ══════════ SCRIPTS ══════════
     Load order matters:
       1. data/db.js   → sets window.CONVBI_DB
       2. Chart.js CDN → sets window.Chart
       3. js/engine.js → reads CONVBI_DB, exports ConvBI.Engine
       4. js/charts.js → reads Chart + ConvBI.Engine, exports ConvBI.Charts
       5. js/chat.js   → reads all above, boots on DOMContentLoaded
-->
<script src="data/db.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
